<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Undangan Ngae Tugas</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', sans-serif;
      background: url('https://www.transparenttextures.com/patterns/white-wave.png'), #fdfcfb;
      color: #704214;
      text-align: center;
    }

    .invitation-section {
      padding: 4rem 2rem;
    }

    .invitation-section img {
      width: 80px;
      margin-bottom: 1rem;
    }

    .invitation-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .invitation-section h1 {
      font-size: 2.2rem;
      font-weight: bold;
      font-family: 'Playfair Display', serif;
      margin-bottom: 1rem;
    }

    .invitation-section p {
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .separator {
      margin: 1rem auto;
      width: 50px;
      height: 2px;
      background: #c19b6b;
    }

    .section {
      padding: 2rem 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
      padding: 0 1rem;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      object-fit: cover;
    }

    iframe {
      max-width: 100%;
      width: 100%;
      border-radius: 10px;
      margin-top: 1rem;
    }

    #toggleMusic {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #fdb62f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      z-index: 999;
    }

    @media (max-width: 480px) {
      .invitation-section h1 {
        font-size: 1.8rem;
      }

      .invitation-section h2 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <section class="invitation-section">
    <img src="image/padidas.jpg" alt="Ornamen" />
    <h2>Undangan</h2>
    <div class="separator"></div>
    <h1>NGAE DATABASE CUY</h1>
    <div class="separator"></div>
    <p><strong>Minggu, 4 Mei 2025</strong></p>
    <p>kost romeo ane ane gang ne menek, Peguyangan, Denpasar Utara</p>
  </section>

  <!-- Lokasi -->
  <section class="section">
    <h2>Lokasi Acara</h2>
    <div class="separator"></div>
    <p>Silakan klik pada peta untuk membuka di Google Maps.</p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3944.7395668369886!2d115.20706569999999!3d-8.620982699999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2dd23f7c96046863%3A0x3e2d87c92769a899!2sKos%20Pak%20Ketut!5e0!3m2!1sid!2sid!4v1746081360768!5m2!1sid!2sid" height="400" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>

  <!-- Galeri -->
  <section class="section">
    <h2>Galeri PECALANG - Pemuda Celak Lantang</h2>
    <div class="separator"></div>
    <div class="gallery">
      <img src="image/1.jpg" alt="Foto 1">
      <img src="image/2.jpg" alt="Foto 2">
      <img src="image/3.jpg" alt="Foto 3">
      <img src="image/4.jpg" alt="Foto 4">
      <img src="image/5.jpg" alt="Foto 5">
      <img src="image/6.jpg" alt="Foto 6">
      <img src="image/7.jpg" alt="Foto 7">
      <img src="image/8.jpg" alt="Foto 8">
      <img src="image/9.jpg" alt="Foto 9">
    </div>
  </section>

  <!-- Musik -->
  <audio id="bgm" loop>
    <source src="image/musik.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>

  <button id="toggleMusic" onclick="toggleMusic()">🔊</button>

  <script>
    const bgm = document.getElementById('bgm');
    const toggleBtn = document.getElementById('toggleMusic');
    let isPlaying = false;

    function toggleMusic() {
      if (!isPlaying) {
        bgm.play();
        toggleBtn.textContent = "🔇";
      } else {
        bgm.pause();
        toggleBtn.textContent = "🔊";
      }
      isPlaying = !isPlaying;
    }
  </script>
</body>
</html>
