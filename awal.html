<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Mepandes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Open Sans', sans-serif;
    }

    body, html {
      height: 100%;
    }

    .hero {
      background-image: url('image/kntl.png'); /* Ganti dengan URL fotomu */
      background-size: cover;
      background-position: center;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .content h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      background-color: #fdb62f;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      color: white;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #f89c00;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h2>Dear,</h2>
      <h1 id="guestName">yanwed</h1>
      <a href="tampilan.html" class="btn">📩 Open Invitation</a>
    </div>
  </div>

  <script>
    // Ganti nama berdasarkan parameter URL (?to=Nama)
    const urlParams = new URLSearchParams(window.location.search);
    const guest = urlParams.get('to');
    if (guest) {
      document.getElementById('guestName').textContent = guest;
    }
  </script>
</body>
</html>
